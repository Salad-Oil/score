name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The bot targets a bare Python on EC2; keep the floor honest.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No third-party runtime dependency exists on purpose, so there is nothing
      # to install before the unit tests.
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      # This is the step that catches a file that does not even parse. It is
      # deliberately separate from the tests: a syntax error in a module no test
      # imports would otherwise slip through. It once did -- a stray `return` at
      # module level kept main red for two pushes while the unit tests passed.
      - name: Byte-compile every module
        run: python -m compileall -q roostoo tests run_live.py run_backtest.py run_sweep.py scripts

      # A PowerShell pipeline (`Get-Content x | Set-Content x -Encoding utf8`)
      # re-encodes UTF-8 as the machine's ANSI codepage and silently replaces every
      # em dash with CJK lookalikes (the common one is U+9225), adding a BOM.
      # Nothing else notices: the file is still valid UTF-8, every test passes, and
      # the damage only shows up as mojibake on GitHub. That happened once, to
      # README.md, CONTRIBUTING.md and docs/FINDINGS.md, so it is checked in CI now.
      - name: Text files are BOM-free UTF-8 with no mojibake
        run: python scripts/check_encoding.py

      - name: Configuration rejects a missing key
        run: |
          if python -c "from roostoo.config import Config; Config.from_env({})"; then
            echo "expected Config.from_env({}) to fail without credentials"; exit 1
          fi

      - name: Mock loop runs end to end
        run: python run_live.py --mock --cycles 2 --loop-interval 5 --no-seed --log-level WARNING

      - name: Backtest runs on the committed sample data
        run: python run_backtest.py --data-dir data --pairs ETH/USD --quiet

  secrets:
    # TWO scanners, because they see different things.
    #
    # HISTORY HAS SINCE BEEN PURGED (see docs/SECURITY.md), so this job is green
    # on a clean tree. It is deliberately NOT part of the required `ci` check
    # yet. That exemption was granted because the job was red while the leaked
    # key was still in history; the purge removed that reason, so the remaining
    # action is to add `secret-scan` to the ruleset's required checks. Until
    # then a credential can still be merged into main.
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole point is scanning history, not the tip

      # Authoritative check: every added line in every commit reachable from any
      # ref, using the same stdlib scanner as the pre-commit hook and
      # publish.ps1. Reachability is what matters -- a key that was committed and
      # later deleted is still published forever, so scanning a push range is not
      # enough.
      - name: Scan the full history (project scanner)
        run: python scripts/scan_secrets.py --history

      # Second, independent opinion: a different rule set with entropy detection.
      # gitleaks-action scans the commits in this push or PR, so it complements
      # the full-history scan above rather than duplicating it. `if: always()`
      # keeps it running even after the step above has already failed, so one run
      # shows the complete picture.
      - name: gitleaks (independent rules, pushed range)
        if: always()
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  ci:
    # A single, stable check name. The branch ruleset requires a status check
    # called exactly `ci`, but a matrix job reports as `test (3.10)` and
    # `test (3.13)`, so requiring `ci` would never be satisfied and every PR
    # would hang on "Expected -- waiting for status to be reported". This gate
    # collapses the matrix into one result under the name the ruleset wants.
    name: ci
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless the test matrix succeeded
        run: |
          result="${{ needs.test.result }}"
          echo "test matrix result: $result"
          if [ "$result" != "success" ]; then
            echo "::error::the test matrix did not succeed ($result)"
            exit 1
          fi
